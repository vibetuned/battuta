[package]
name = "battuta-editor"
version = "1.2.0"
license = "AGPL-3.0-only"
description = "battuta — MEI score editor"
edition = "2021"

# The shell is a library: main.rs launches it on desktop, and the mobile
# projects load it — a shared object on Android, a static library linked
# into the iPadOS app (battuta's own code; Verovio is WASM in the WebView).
[lib]
name = "battuta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only services: native dialogs, MIDI, and the workspace watcher
# (slice 9a: live file watching under the folders the user opened).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"
midir = "0.10"
notify = "6"

# CoreMIDI delivers hot-plug notifications to the run loop of the thread
# that created the MIDI client — the poll thread must PUMP one on macOS
# or the device list stays frozen at the startup snapshot.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[features]
# Embed ../dist and serve it over tauri:// instead of loading devUrl.
# `tauri build` enables this automatically; plain cargo needs it explicitly:
#   cargo build --release --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Fast-enough builds; full LTO not worth it for the shell.
lto = false
