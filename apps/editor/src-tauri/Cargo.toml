[package]
name = "battuta-editor"
version = "0.0.0"
description = "battuta — MEI score editor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Embed ../dist and serve it over tauri:// instead of loading devUrl.
# `tauri build` enables this automatically; plain cargo needs it explicitly:
#   cargo build --release --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Fast-enough builds; full LTO not worth it for the shell.
lto = false
