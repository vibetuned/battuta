# Unit tests on every push and PR: the core command/engine suite, the
# editor's suites (incl. the virtual-keyboard guard: every keymap action
# must be reachable from the on-screen panel), the @battuta/api surface
# snapshot (a public type change without a version bump fails here), and
# the host bundle budget (the initial chunk under apps/editor/budget.json,
# no plugin chunk reachable statically).
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci runs @battuta/core's prepare, which builds the dist the
      # editor's typecheck and tests resolve against.
      - run: npm ci
      - run: npm run typecheck -w @battuta/editor
      - run: npx vitest run --root packages/core
      - run: npx vitest run --root packages/api
      - run: npm test -w @battuta/editor
      # Bundle budget: build for real, then measure the initial chunk.
      - run: npm run build -w @battuta/editor
      - run: npm run budget -w @battuta/editor
