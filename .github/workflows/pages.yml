# Builds the user guide (Astro) and the web editor (Vite) into ONE static
# site and deploys it to GitHub Pages, served at https://battuta.vibetuned.com:
#
#   /         the docs (docs/dist)
#   /editor/  the editor, built with --base=/editor/ so its hashed assets
#             resolve under the subpath (the Tauri bundle keeps the default
#             base — the flag lives here, not in vite.config.ts)
#
# The custom domain is set in the repo's Pages settings (not a CNAME file —
# workflow deployments read it from settings), with a DNS CNAME record
# battuta.vibetuned.com -> vibetuned.github.io.
name: pages

on:
  push:
    branches: [main]
  # A published release refreshes the site's apt repository (below).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # cairo (rsvg-convert) + ImageMagick rasterise the docs' icons and
      # social card; without them the figure script skips those with a
      # warning and the site ships without icons.
      - name: raster tools for the docs figures
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
      # npm ci runs @battuta/core's prepare; the editor build's prebuild
      # rebuilds it — no explicit core-build step needed.
      - run: npm ci
      - run: npm ci --prefix docs
      - name: build editor for the web (served under /editor/)
        run: npm run build -w @battuta/editor -- --base=/editor/
      - name: build docs
        run: npm run docs:build
      - name: assemble site (docs at /, editor at /editor/)
        run: |
          mkdir -p site/editor
          cp -r docs/dist/. site/
          cp -r apps/editor/dist/. site/editor/
      # Signed apt repository at /apt — the Ubuntu/Debian install channel
      # (a Launchpad PPA would rebuild from source on their builders; a
      # binary repo serves the CI-built deb instead). Skipped until the
      # APT_GPG_PRIVATE_KEY secret and a published release exist.
      - name: apt repository (latest release deb, signed)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        if: env.APT_GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p site/apt/pool/main
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir site/apt/pool/main; then
            echo "no published release with a deb yet — apt repo skipped"
            rm -rf site/apt
            exit 0
          fi
          gpg --batch --import <<< "$APT_GPG_PRIVATE_KEY"
          cd site/apt
          mkdir -p dists/stable/main/binary-amd64
          apt-ftparchive --arch amd64 packages pool > dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=battuta \
            -o APT::FTPArchive::Release::Label=battuta \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            release dists/stable > dists/stable/Release
          gpg --batch --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --armor --export > battuta.asc
          echo "apt repo: $(ls pool/main)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
